server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # The reverse proxy terminates TLS and sets the security headers that
    # apply site-wide; these cover the static assets themselves.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    # The catalogue is private; it must never be indexed.
    add_header X-Robots-Tag "noindex, nofollow" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Hashed asset filenames can be cached indefinitely.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html must never be cached, or a deploy would not reach clients.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires 0;
    }

    # Single-page app: unknown paths are client-side routes.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
