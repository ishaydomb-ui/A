# Local single-machine serving: the client plus an /api proxy, so the browser
# sees one origin and the session cookie behaves exactly as in production.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Robots-Tag "noindex, nofollow" always;

    client_max_body_size 32m;

    # Docker's embedded DNS. Resolving the upstream per request rather than at
    # start-up matters: with a literal `proxy_pass http://api:4000` nginx
    # resolves the name while loading its configuration and exits if the API
    # container is not up yet, which takes the whole site down instead of just
    # the API calls.
    resolver 127.0.0.11 ipv6=off valid=10s;

    location /api/ {
        set $api_upstream http://api:4000;
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location = /healthz {
        set $api_health http://api:4000;
        proxy_pass $api_health/healthz;
    }
    location = /readyz {
        set $api_ready http://api:4000;
        proxy_pass $api_ready/readyz;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
    # Every real route (/medications/..., /catalogue, /) is served the same
    # index.html through this fallback, so the no-store directive has to live
    # here and not only on the literal /index.html path — which almost nobody
    # requests. Without it a browser may cache the HTML heuristically, and
    # after a deploy that HTML asks for asset filenames the new image no
    # longer contains: a blank page until someone thinks to hard-refresh.
    #
    # add_header does not inherit into a location that declares its own, so
    # the security headers are repeated rather than lost. In production Caddy
    # sets them too; this keeps the local stack equivalent.
    location / {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files $uri $uri/ /index.html;
    }
}
